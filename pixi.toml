[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "fvode"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "osx-64", "win-64"]
version = "0.0.1"

[dependencies]
gfortran = "16.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"
ford = ">=7.0"

[tasks]
build = "fpm build --profile release"
test = "fpm test --profile debug"
examples = "fpm run --example 'cv_*' --profile release"
# pixi skips conda post-link scripts, so register the graphviz plugins first
graphviz-config = "dot -c"
docs = { cmd = "ford fpm.toml", depends-on = ["graphviz-config"] }
lint = "fpm build --profile debug --flag '-Wall -Wextra -std=f2018 -fcheck=all'"

# ---------------------------------------------------------------------------
# Reference C SUNDIALS (pinned v7.9.0), used only for verification
# ---------------------------------------------------------------------------
[feature.reference]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[feature.reference.dependencies]
cmake = ">=3.24"
ninja = "*"
git = "*"

# c-compiler pins gcc 15 on linux, which conflicts with gfortran 16
[feature.reference.target.linux.dependencies]
gcc = "16.*"

[feature.reference.target.osx.dependencies]
c-compiler = "*"

[feature.reference.tasks]
ref-build = "bash reference/build_reference.sh"
ref-run = { cmd = "bash reference/run_reference.sh", depends-on = ["ref-build"] }
fvode-traces = "bash reference/run_fvode_traces.sh"
# fidelity check: FVODE built without FMA contraction must match the C reference exactly
compare-exact = { cmd = "bash reference/run_fvode_traces.sh --flag -ffp-contract=off && python reference/compare.py --exact", depends-on = ["ref-run"] }
# sanity check of the normal (optimized) build: tolerance-based, see reference/compare.py
compare = { cmd = "bash reference/run_fvode_traces.sh && python reference/compare.py", depends-on = ["ref-run"] }

[environments]
reference = ["reference"]
