name = "fvode"
version = "0.0.1"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
copyright = "Copyright (c) 2026 Jacob Williams. Portions derived from SUNDIALS (BSD-3-Clause)."
description = "Modern Fortran port of CVODE"
keywords = ["ode", "cvode", "sundials", "bdf", "adams", "stiff", "integrator"]

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive", tag = "v0.5.0" }
ddeabm = { git = "https://github.com/jacobwilliams/ddeabm", tag = "4.0.0" }
dvode = { git = "https://github.com/jacobwilliams/dvode", rev = "59d2eedd1410a4bd6c196c24d08f95a7c20565c0" }
pyplot-fortran = { git = "https://github.com/jacobwilliams/pyplot-fortran", tag = "3.8.0" }

[extra.ford]
project = "fvode"
summary = "Modern Fortran port of CVODE"
project_github = "https://github.com/jacobwilliams/fvode"
author = "Jacob Williams"
github = "https://github.com/jacobwilliams"
predocmark_alt = ">"
predocmark = "<"
docmark_alt = ""
docmark = "!"
license = "MIT"
src_dir = ["./src"]
output_dir = "./doc"
display = ["public", "protected", "private"]
source = true
graph = true
sort = "alpha"
search = true

# step-trace drivers for verification against the C reference (see reference/)
[[example]]
name = "trace_vdp_adams_fp"
source-dir = "reference/fortran"
main = "trace_vdp_adams_fp.f90"

[[example]]
name = "trace_vdp_adams_aa"
source-dir = "reference/fortran"
main = "trace_vdp_adams_aa.f90"

[[example]]
name = "trace_vdp_adams_aa_damped"
source-dir = "reference/fortran"
main = "trace_vdp_adams_aa_damped.f90"

[[example]]
name = "trace_analytic_fp"
source-dir = "reference/fortran"
main = "trace_analytic_fp.f90"

[[example]]
name = "trace_roberts_bdf_dense"
source-dir = "reference/fortran"
main = "trace_roberts_bdf_dense.f90"

[[example]]
name = "trace_osc_bdf_stald"
source-dir = "reference/fortran"
main = "trace_osc_bdf_stald.f90"

[[example]]
name = "trace_resize_adams_fp_same"
source-dir = "reference/fortran"
main = "trace_resize_adams_fp_same.f90"

[[example]]
name = "trace_resize_adams_fp_grow"
source-dir = "reference/fortran"
main = "trace_resize_adams_fp_grow.f90"

[[example]]
name = "trace_resize_bdf_newton_same"
source-dir = "reference/fortran"
main = "trace_resize_bdf_newton_same.f90"

[[example]]
name = "trace_resize_bdf_newton_grow"
source-dir = "reference/fortran"
main = "trace_resize_bdf_newton_grow.f90"
